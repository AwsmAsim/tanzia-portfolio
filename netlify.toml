[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Admin panel
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# SPA-style fallback (single page; harmless and future-proof)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
